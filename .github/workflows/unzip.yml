name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip any zip file
        run: |
          ls -la
          for f in *.zip; do
            [ -e "$f" ] || continue
            echo "Unzipping $f"
            unzip -o "$f"
            rm "$f"
          done
      - name: Push extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Unzipped" || echo "No changes"
          git push
